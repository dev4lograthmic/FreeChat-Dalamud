syntax = "proto3";

package freechat.v1;

import "freechat/v1/common.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "FreeChat.Protocol.V1";

// Identity and capabilities of the game-side server. Returned before pairing
// completes so the client can display the character/fingerprint and compare
// them with the plugin UI.
message ServerInfo {
  string server_id = 1;
  string server_name = 2;
  CharacterRef character = 3;
  uint32 protocol_version = 4;
  string server_version = 5;
  // SHA-256 of the server's P-256 public key in X9.63 uncompressed form
  // (0x04 || X || Y). 32 bytes.
  bytes public_key_fingerprint = 6;
  ServerCapabilities capabilities = 7;
  google.protobuf.Timestamp server_time = 8;

  reserved 9 to 15;
}

// First client message after the WebSocket is established.
message ClientHello {
  uint32 protocol_version = 1;
  string client_name = 2;
  string client_version = 3;
  // windows / ios / android / macos / cli / other
  string platform = 4;
  // Stable per-install device identifier. Generated by the client on first
  // run and reused across reconnects.
  string device_id = 5;
  // P-256 public key in X9.63 uncompressed form (0x04 || X || Y).
  // Required for pairing; optional on reconnect when device_id is known.
  bytes device_public_key = 6;
  // One-time pairing code from the plugin UI/QR. Only for first pairing.
  string pairing_code = 7;
  // 0 or negative: start from live. > 0: resume after this sequence.
  int64 resume_from_sequence = 8;
  repeated string capabilities = 9;

  reserved 10 to 15;
}

// Sent after successful authentication.
message Welcome {
  ServerInfo server = 1;
  string session_id = 2;
  int64 oldest_sequence = 3;
  int64 latest_sequence = 4;
  string device_id = 5;
  repeated string enabled_features = 6;

  reserved 7 to 15;
}

// The client is not trusted yet. The user must read the pairing code from the
// plugin UI and send PairRequest. The code is never sent by the server.
message PairingRequired {
  ServerInfo server = 1;
  string reason = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint32 code_length = 4;

  reserved 5 to 15;
}

message PairRequest {
  string code = 1;
  string device_name = 2;
  string platform = 3;
  // P-256 public key in X9.63 uncompressed form (0x04 || X || Y).
  bytes device_public_key = 4;
  ClientCapabilities capabilities = 5;

  reserved 6 to 15;
}

message PairResult {
  bool ok = 1;
  string device_id = 2;
  ErrorCode error = 3;
  string message = 4;

  reserved 5 to 15;
}

// Sent to a known device. The client signs the nonce with its device private
// key using ECDSA P-256 + SHA-256 in IEEE P1363 format (64 bytes, r || s).
message Challenge {
  bytes nonce = 1;
  string algorithm = 2;
  google.protobuf.Timestamp expires_at = 3;

  reserved 4 to 15;
}

message ChallengeResponse {
  bytes signature = 1;

  reserved 2 to 15;
}

message AuthError {
  ErrorCode code = 1;
  string message = 2;

  reserved 3 to 15;
}
